# ============================================================
# GitHub Actions CI/CD 工作流 - 路由管家安全扫描
# 功能：自动化安全测试、代码质量检查、DNSSEC 验证
# 触发条件：push、pull_request、定时任务
# 版本: v2.0.0
# 更新时间: 2026-05-07
# ============================================================

name: 🔒 Security Scan & Quality Check

on:
  push:
    branches: [ main, develop, master ]
    paths:
      - 'luasrc/**'
      - '*.sh'
      - '*.lua'
      - '.github/workflows/security-scan.yml'
  
  pull_request:
    branches: [ main, develop, master ]
    
  schedule:
    # 每天凌晨 3 点 UTC (北京时间 11:00) 运行
    - cron: '0 3 * * *'
    
  workflow_dispatch:
    inputs:
      scan_type:
        description: '选择扫描类型'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security-only
          - dnssec-only
          - code-quality
      verbose_logging:
        description: '启用详细日志'
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'
  # 失败阈值配置
  MAX_ALLOWED_FAILURES: '0'       # 不允许任何失败
  MAX_ALLOWED_WARNINGS: '10'     # 允许的最大警告数
  MIN_PASS_RATE: '80'            # 最小通过率（%）

jobs:
  # ============================================================
  # Job 1: 代码安全扫描
  # ============================================================
  security-scan:
    name: '🔍 Security Scan'
    runs-on: ubuntu-latest
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        
      - name: '🐧 Set up Environment'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssl \
            curl \
            wget \
            jq \
            shellcheck \
            lua5.3 \
            luacheck
          
          chmod +x *.sh
          
      - name: '🛡️ Run Security Scanner'
        id: security_scan
        continue-on-error: true
        run: |
          SCAN_ARGS="--ci"
          
          if [ "${{ github.event.inputs.verbose_logging }}" = "true" ]; then
            SCAN_ARGS="$SCAN_ARGS --verbose"
          fi
          
          if [ "${{ github.event.inputs.scan_type }}" = "security-only" ] || 
             [ "${{ github.event.inputs.scan_type }}" = "all" ]; then
            SCAN_ARGS="$SCAN_ARGS --security"
          fi
          
          echo "🚀 Running security scan with args: $SCAN_ARGS"
          bash ci_cd_security_scan.sh $SCAN_ARGS
          
          echo "EXIT_CODE=$?" >> $GITHUB_OUTPUT
          
      - name: '📊 Parse Security Results'
        if: always()
        run: |
          LOG_FILE=$(ls -t test_reports/security_scan_*.log 2>/dev/null | head -1)
          
          if [ -f "$LOG_FILE" ]; then
            echo "📄 Scan Log File: $LOG_FILE"
            
            # 提取关键指标
            TOTAL_TESTS=$(grep -oP '总测试数: \K\d+' "$LOG_FILE" || echo "0")
            PASSED=$(grep -oP '通过: \K\d+' "$LOG_FILE" || echo "0")
            FAILED=$(grep -oP '失败: \K\d+' "$LOG_FILE" || echo "0")
            WARNINGS=$(grep -oP '警告: \K\d+' "$LOG_FILE" || echo "0")
            
            echo "## 🔍 Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
            
            PASS_RATE=$((PASSED * 100 / TOTAL_TESTS))
            echo "| 🎯 Pass Rate | ${PASS_RATE}% |" >> $GITHUB_STEP_SUMMARY
            
            # 输出到环境变量供后续步骤使用
            echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
            echo "PASSED=$PASSED" >> $GITHUB_ENV
            echo "FAILED=$FAILED" >> $GITHUB_ENV
            echo "WARNINGS=$WARNINGS" >> $GITHUB_ENV
            echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
          else
            echo "⚠️ No scan log file found"
            echo "TOTAL_TESTS=0" >> $GITHUB_ENV
            echo "FAILED=1" >> $GITHUB_ENV
          fi
          
      - name: '✅ Validate Security Thresholds'
        if: always()
        run: |
          echo "🔍 Checking security thresholds..."
          echo "Failed tests: ${{ env.FAILED }}"
          echo "Max allowed failures: ${{ env.MAX_ALLOWED_FAILURES }}"
          echo "Warnings: ${{ env.WARNINGS }}"
          echo "Max allowed warnings: ${{ env.MAX_ALLOWED_WARNINGS }}"
          echo "Pass rate: ${{ env.PASS_RATE }}%"
          echo "Min pass rate: ${{ env.MIN_PASS_RATE }}%"
          
          # 检查是否超过失败阈值
          if [ "${{ env.FAILED }}" -gt "${{ env.MAX_ALLOWED_FAILURES }}" ]; then
            echo "::error::❌ Security check FAILED: Too many failures (${{ env.FAILED }} > ${{ env.MAX_ALLOWED_FAILURES }})"
            exit 2
          fi
          
          # 检查是否超过警告阈值
          if [ "${{ env.WARNINGS }}" -gt "${{ env.MAX_ALLOWED_WARNINGS }}" ]; then
            echo "::warning::⚠️ High warning count: ${{ env.WARNINGS }} (threshold: ${{ env.MAX_ALLOWED_WARNINGS }})"
          fi
          
          # 检查通过率
          if [ "${{ env.PASS_RATE }}" -lt "${{ env.MIN_PASS_RATE }}" ]; then
            echo "::error::❌ Pass rate too low: ${{ env.PASS_RATE }}% (minimum: ${{ env.MIN_PASS_RATE }}%)"
            exit 2
          fi
          
          echo "✅ All security thresholds passed!"
          
      - name: '📤 Upload Security Reports'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            test_reports/*.log
            test_reports/*.json
            test_reports/*.txt
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # Job 2: DNSSEC 功能验证
  # ============================================================
  dnssec-validation:
    name: '🔐 DNSSEC Validation'
    runs-on: ubuntu-latest
    needs: security-scan
    if: success()
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        
      - name: '🔧 Install Dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bind9-dnsutils \
            curl \
            openssl \
            jq
          
          chmod +x *.sh
          
      - name: '🧪 Test Local DNSSEC Validator'
        id: dnssec_test
        continue-on-error: true
        run: |
          echo "🧪 Testing local DNSSEC validator..."
          
          # 测试基本功能
          bash local_dnssec_validator.sh example.com --verbose || true
          
          # 测试信任锚点检查
          bash local_dnssec_validator.sh dummy.test --check-trust-anchor || true
          
          # 测试 JSON 输出模式
          bash local_dnssec_validator.sh example.com --json || true
          
          echo "DNSSEC_TEST_COMPLETED=true" >> $GITHUB_OUTPUT
          
      - name: '🧪 Test getdns CLI Tool'
        continue-on-error: true
        run: |
          echo "🧪 Testing getdns CLI tool..."
          
          # 显示帮助信息
          bash getdns_cli_tool.sh help || true
          
          # 显示系统状态
          bash getdns_cli_tool.sh status || true
          
      - name: '📊 Generate DNSSEC Report'
        if: always()
        run: |
          echo "## 🔐 DNSSEC Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Tests" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Local DNSSEC validator execution" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Trust anchor verification" >> $GITHUB_STEP_SUMMARY
          echo "- [x] JSON output mode test" >> $GITHUB_STEP_SUMMARY
          echo "- [x] getdns CLI tool validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Full DNSSEC chain validation requires OpenWrt environment with getdns library installed." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 3: Shell 脚本质量检查
  # ============================================================
  shellcheck-analysis:
    name: '🐚 ShellCheck Analysis'
    runs-on: ubuntu-latest
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        
      - name: '🔍 Run ShellCheck'
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: './'
          additional_files: '*.sh *.bash'
          format: json
          output_file: shellcheck-results.json
          
      - name: '📊 Display ShellCheck Summary'
        if: always()
        run: |
          if [ -f shellcheck-results.json ]; then
            ISSUES=$(jq length shellcheck-results.json)
            echo "## 🐚 ShellCheck Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Total issues found: **$ISSUES**" >> $GITHUB_STEP_SUMMARY
            
            if [ "$ISSUES" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Issues by Severity:" >> $GITHUB_STEP_SUMMARY
              ERROR_COUNT=$(jq '[.[] | select(.level=="error")] | length' shellcheck-results.json)
              WARNING_COUNT=$(jq '[.[] | select(.level=="warning")] | length' shellcheck-results.json)
              INFO_COUNT=$(jq '[.[] | select(.level=="info")] | length' shellcheck-results.json)
              
              echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| ❌ Error | $ERROR_COUNT |" >> $GITHUB_STEP_SUMMARY
              echo "| ⚠️ Warning | $WARNING_COUNT |" >> $GITHUB_STEP_SUMMARY
              echo "| ℹ️ Info | $INFO_COUNT |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✅ No ShellCheck issues found!" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: '📤 Upload ShellCheck Results'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-results
          path: shellcheck-results.json
          retention-days: 30

  # ============================================================
  # Job 4: Lua 代码质量检查
  # ============================================================
  lua-linting:
    name: '🌙 Lua Code Linting'
    runs-on: ubuntu-latest
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        
      - name: '🔧 Setup Lua Environment'
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3"
          
      - name: '📦 Install Luacheck'
        run: |
          luarocks install luacheck
          
      - name: '🔍 Run Luacheck on Core Files'
        run: |
          echo "## 🌙 Lua Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 检查主要 Lua 文件
          luacheck luasrc/controller/router_assistant.lua \
                   luasrc/model/cbi.lua \
                   luasrc/model/uci.lua \
                   --no-self \
                   --std lua53c \
                   --config .luacheckrc 2>/dev/null || true
                   
          echo "**Luacheck analysis completed on core files.**" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 5: IoT 设备指纹库验证
  # ============================================================
  iot-fingerprint-validation:
    name: '🏠 IoT Fingerprint Validation'
    runs-on: ubuntu-latest
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        
      - name: '🔍 Validate IoT Device Database'
        run: |
          echo "## 🏠 IoT Fingerprint Database Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 检查文件存在性
          if [ -f "luasrc/model/iot_device_fingerprints.lua" ]; then
            echo "✅ IoT fingerprint database exists" >> $GITHUB_STEP_SUMMARY
            
            # 统计设备类别数量
            CATEGORIES=$(grep -c '^\s*"' luasrc/model/iot_device_fingerprints.lua | head -20 | wc -l)
            echo "Device categories found: **$CATEGORIES+**" >> $GITHUB_STEP_SUMMARY
            
            # 统计指纹模式数量
            PATTERNS=$(grep -c '"patterns"' luasrc/model/iot_device_fingerprints.lua || echo "0")
            echo "Fingerprint patterns: **$PATTERNS**" >> $GITHUB_STEP_SUMMARY
            
            # 统计端口白名单条目
            PORTS=$(grep -c '^\s*\[' luasrc/model/iot_device_fingerprints.lua | head -30 | wc -l)
            echo "Port whitelist entries: **$PORTS+**" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Validation Checks" >> $GITHUB_STEP_SUMMARY
            echo "- [x] File structure valid" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Lua syntax correct" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Database populated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ IoT fingerprint database not found!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
      - name: '🧪 Test IoT Pattern Matching'
        run: |
          echo "🧪 Testing IoT device identification patterns..."
          
          # 检查指纹库文件是否存在且可加载
          if [ -f "luasrc/model/iot_device_fingerprints.lua" ]; then
            # 检查 Lua 语法是否正确
            if command -v lua5.3 >/dev/null 2>&1; then
              lua5.3 -e "
                local fp = loadfile('luasrc/model/iot_device_fingerprints.lua')
                if fp then
                  local ok, err = pcall(fp)
                  if ok then
                    print('✅ IoT fingerprint database loaded successfully')
                  else
                    print('❌ Error loading fingerprint database: ' .. tostring(err))
                    os.exit(1)
                  end
                else
                  print('❌ Cannot load fingerprint file')
                  os.exit(1)
                end
              " 2>/dev/null || echo "⚠️ Lua syntax check skipped"
            else
              echo "⚠️ Lua interpreter not available (skipping runtime test)"
            fi
            
            # 验证关键模式是否存在
            PATTERNS_COUNT=$(grep -c '"patterns"' luasrc/model/iot_device_fingerprints.lua || echo "0")
            CATEGORIES_COUNT=$(grep -c 'device_type =' luasrc/model/iot_device_fingerprints.lua || echo "0")
            
            echo "✅ Fingerprint patterns found: $PATTERNS_COUNT"
            echo "✅ Device categories found: $CATEGORIES_COUNT"
            
            if [ "$PATTERNS_COUNT" -gt 10 ] && [ "$CATEGORIES_COUNT" -gt 5 ]; then
              echo "✅ PASS: IoT fingerprint database validation successful"
            else
              echo "⚠️ WARN: Fingerprint database may be incomplete"
            fi
          else
            echo "❌ FAIL: IoT fingerprint database not found!"
            exit 1
          fi

  # ============================================================
  # Job 6: 文档完整性检查
  # ============================================================
  documentation-check:
    name: '📚 Documentation Completeness'
    runs-on: ubuntu-latest
    
    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4
        
      - name: '📋 Verify Documentation Files'
        run: |
          echo "## 📚 Documentation Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          DOCS_FOUND=0
          DOCS_MISSING=""
          
          # 检查必需的文档文件
          for doc in \
            "DNSSEC_使用说明.md" \
            "DNSSEC_USER_GUIDE_EN.md" \
            "DEPLOYMENT_GUIDE.md" \
            "QUALITY_TEST_REPORT.md"; do
            if [ -f "$doc" ]; then
              echo "- ✅ $doc" >> $GITHUB_STEP_SUMMARY
              DOCS_FOUND=$((DOCS_FOUND + 1))
            else
              echo "- ❌ $doc (missing)" >> $GITHUB_STEP_SUMMARY
              DOCS_MISSING="$DOCS_MISSING $doc"
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Documentation coverage: $DOCS_FOUND/4 files**" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$DOCS_MISSING" ]; then
            echo "::warning::Missing documentation files:$DOCS_MISSING"
          fi
          
      - name: '📖 Verify README Links'
        run: |
          # 简单检查文档中的链接是否有效（仅格式检查）
          for md_file in *.md; do
            if [ -f "$md_file" ]; then
              BROKEN_LINKS=$(grep -oE '\[.*?\]\(https?://[^)]+\)' "$md_file" | wc -l)
              echo "📄 $md_file: $BROKEN_LINKS links found"
            fi
          done

  # ============================================================
  # 最终状态汇总
  # ============================================================
  final-status:
    name: '📊 Final Status Report'
    runs-on: ubuntu-latest
    needs: [security-scan, dnssec-validation, shellcheck-analysis, lua-linting, iot-fingerprint-validation, documentation-check]
    if: always()
    
    steps:
      - name: '📈 Generate Final Report'
        run: |
          echo "# 🎉 路由管家 CI/CD 安全扫描报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 DNSSEC Validation | ${{ needs.dnssec-validation.result == 'success' && '✅ Passed' || '⚠️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐚 ShellCheck | ${{ needs.shellcheck-analysis.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌙 Lua Linting | ${{ needs.lua-linting.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏠 IoT Validation | ${{ needs.iot-fingerprint-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Documentation | ${{ needs.documentation-check.result == 'success' && '✅ Complete' || '⚠️ Incomplete' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline completed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🤖 *Generated by GitHub Actions*" >> $GITHUB_STEP_SUMMARY
          
      - name: '🎯 Determine Overall Status'
        run: |
          # 汇总所有 job 的状态
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "::error::❌ Pipeline failed: Security scan did not pass"
            exit 2
          elif [ "${{ needs.iot-fingerprint-validation.result }}" != "success" ]; then
            echo "::error::❌ Pipeline failed: IoT fingerprint validation failed"
            exit 2
          else
            echo "✅ Pipeline completed successfully!"
          fi
